<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zazzau '26 — Delegate Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --amina:   #B03A2E;
  --sardauna:#212121;
  --ribadu:  #154360;
  --bamalli: #1D6A3A;
  --amina-light: #fdecea;
  --sardauna-light: #ececec;
  --ribadu-light:  #dbeafe;
  --bamalli-light: #dcfce7;
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface2: #F0EFE9;
  --border: #E2E0D8;
  --text: #1a1a1a;
  --muted: #7a7a7a;
  --navy: #0f1f3d;
  --gold: #B8972A;
  --gold-light: #f5edd6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SPLASH ── */
#splash {
  position: fixed;
  inset: 0;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  gap: 0;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
#splash.fade-out {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}
.splash-logos {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  margin-bottom: 36px;
  animation: logoIn 0.9s cubic-bezier(.22,.68,0,1.2) both;
}
@keyframes logoIn {
  from { opacity: 0; transform: translateY(24px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.splash-logo-img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  padding: 6px;
}
.splash-logo-img.shield {
  border-radius: 0;
  background: none;
  border: none;
  width: 100px;
}
.splash-divider {
  width: 1px;
  height: 60px;
  background: rgba(255,255,255,0.2);
}
.splash-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 38px;
  color: #fff;
  letter-spacing: -1px;
  text-align: center;
  animation: titleIn 0.9s 0.2s cubic-bezier(.22,.68,0,1.2) both;
}
.splash-title span { color: var(--gold); }
@keyframes titleIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.splash-sub {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 10px;
  text-align: center;
  animation: titleIn 0.9s 0.35s cubic-bezier(.22,.68,0,1.2) both;
}
.splash-bar {
  width: 180px;
  height: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  margin-top: 40px;
  overflow: hidden;
  animation: titleIn 0.5s 0.5s both;
}
.splash-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  animation: barFill 2.5s 0.6s ease forwards;
  width: 0%;
}
@keyframes barFill {
  to { width: 100%; }
}

/* ── MAIN APP ── */
#app {
  opacity: 0;
  transition: opacity 0.5s ease;
}
#app.visible { opacity: 1; }

/* ── NAV ── */
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--navy);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-brand-logo {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.nav-logo {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 17px;
  color: #fff;
  letter-spacing: -0.3px;
}
.nav-logo span { color: var(--gold); }
.nav-tabs {
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 3px;
}
.tab-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.55);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 13px;
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
}
.tab-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
.tab-btn.active { color: var(--navy); background: #fff; font-weight: 600; }

/* ── PAGES ── */
.page { display: none; padding: 24px 20px; max-width: 560px; margin: 0 auto; }
.page.active { display: block; animation: pageIn 0.3s ease; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.lb-page { max-width: 640px; }

/* ── TYPOGRAPHY ── */
.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
  color: var(--navy);
}
.section-sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 24px;
}

/* ── SEARCH ── */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px 14px 46px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.search-input:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(15,31,61,0.08);
}
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.search-results {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.result-item {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 13px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 13px;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.result-item:hover {
  border-color: var(--navy);
  box-shadow: 0 4px 16px rgba(15,31,61,0.1);
  transform: translateY(-1px);
}
.result-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  color: white;
}
.result-info { flex: 1; min-width: 0; }
.result-name {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--navy);
}
.result-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.result-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  flex-shrink: 0;
}

/* ── PROFILE ── */
.profile-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.profile-banner {
  height: 90px;
  position: relative;
}
.profile-banner-inner {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 20px;
}
.profile-team-crest {
  font-size: 42px;
  opacity: 0.25;
}
.profile-avatar-wrap {
  padding: 0 20px;
  margin-top: -26px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.profile-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 18px;
  color: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.profile-checkin-btn {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.profile-checkin-btn:hover { background: var(--navy); color: white; border-color: var(--navy); }
.profile-checkin-btn.checked {
  background: #dcfce7;
  border-color: #16a34a;
  color: #15803d;
}
.profile-body { padding: 0 20px 20px; }
.profile-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.3px;
  margin-bottom: 3px;
  color: var(--navy);
}
.profile-nickname { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.profile-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.profile-field label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 4px;
}
.profile-field .val {
  font-size: 14px;
  font-weight: 500;
  color: var(--navy);
}
.profile-id-row {
  background: var(--gold-light);
  border: 1px solid #e8d48a;
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.profile-id-label { color: var(--gold); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.profile-id-val {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 3px;
}
.checkin-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
}
.checkin-status.in { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.checkin-status.out { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

.back-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  cursor: pointer;
  padding: 0;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--navy); }

/* ── LEADERBOARD ── */
.lb-teams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 28px;
}
.lb-team-card {
  border-radius: 16px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
}
.lb-team-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
}
.lb-team-card.rank-1 { grid-column: span 2; }
.lb-rank {
  position: absolute;
  top: 10px;
  right: 14px;
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 900;
  opacity: 0.12;
}
.lb-crest { font-size: 30px; margin-bottom: 10px; }
.lb-team-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 8px;
}
.lb-points {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 38px;
  letter-spacing: -1px;
}
.lb-points span {
  font-size: 13px;
  font-weight: 400;
  opacity: 0.6;
  letter-spacing: 0;
  margin-left: 4px;
}
.lb-team-amina    { background: linear-gradient(135deg, #7b1c15, #b03a2e); color: #fdecea; }
.lb-team-sardauna { background: linear-gradient(135deg, #1a1a1a, #333); color: #f0f0f0; }
.lb-team-ribadu   { background: linear-gradient(135deg, #0e2d4a, #154360); color: #dbeafe; }
.lb-team-bamalli  { background: linear-gradient(135deg, #0f3d22, #1d6a3a); color: #dcfce7; }

.lb-history-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--navy);
}
.lb-log-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  animation: pageIn 0.3s ease;
}
.lb-log-item:last-child { border-bottom: none; }
.lb-log-left { flex: 1; }
.lb-log-event { font-weight: 600; color: var(--navy); }
.lb-log-team-name { color: var(--muted); font-size: 12px; margin-top: 2px; }
.lb-log-pts {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 20px;
}
.empty-log {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 28px 0;
}

/* ── ADMIN ── */
.admin-gate {
  max-width: 400px;
  margin: 48px auto 0;
  text-align: center;
}
.admin-gate h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 8px;
  color: var(--navy);
}
.admin-gate p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.pin-row { display: flex; gap: 8px; margin-bottom: 12px; }
.pin-input {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pin-input:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(15,31,61,0.08);
}
.pin-err { color: #b03a2e; font-size: 12px; margin-bottom: 12px; min-height: 16px; }
.btn-primary {
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px 24px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  transition: opacity 0.15s, transform 0.15s;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 20px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover { background: var(--border); }
.btn-danger {
  background: #fdecea;
  color: #b03a2e;
  border: 1px solid #fca5a5;
  border-radius: 8px;
  padding: 6px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover { background: #fee2e2; }

.admin-panel { max-width: 560px; }
.admin-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.admin-section {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.admin-section h3 {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--navy);
}
.admin-field { margin-bottom: 14px; }
.admin-field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.admin-input {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.admin-input:focus { border-color: var(--navy); }
.team-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.team-btn {
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  transition: all 0.15s;
}
.team-btn:hover { transform: translateY(-1px); }
.team-btn.selected { border-color: var(--gold) !important; box-shadow: 0 0 0 3px rgba(184,151,42,0.2); }
.team-btn-amina    { background: linear-gradient(135deg, #7b1c15, #b03a2e); color: #fdecea; }
.team-btn-sardauna { background: linear-gradient(135deg, #1a1a1a, #333); color: #f0f0f0; }
.team-btn-ribadu   { background: linear-gradient(135deg, #0e2d4a, #154360); color: #dbeafe; }
.team-btn-bamalli  { background: linear-gradient(135deg, #0f3d22, #1d6a3a); color: #dcfce7; }
.points-row { display: flex; align-items: center; gap: 8px; }
.points-row .admin-input { flex: 1; }
.points-adj {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--text);
  width: 40px;
  height: 40px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.points-adj:hover { background: var(--border); }

/* ── TOAST ── */
.success-toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy);
  color: white;
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  transition: transform 0.35s cubic-bezier(.22,.68,0,1.2);
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
  box-shadow: 0 4px 20px rgba(15,31,61,0.25);
}
.success-toast.show { transform: translateX(-50%) translateY(0); }

/* ── CONFETTI CANVAS ── */
#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 998;
}

/* ── TEAM COLOR HELPERS ── */
.team-amina    { background: var(--amina); }
.team-sardauna { background: var(--sardauna); }
.team-ribadu   { background: var(--ribadu); }
.team-bamalli  { background: var(--bamalli); }
.team-amina-soft    { background: var(--amina-light); color: var(--amina); }
.team-sardauna-soft { background: var(--sardauna-light); color: #333; }
.team-ribadu-soft   { background: var(--ribadu-light); color: var(--ribadu); }
.team-bamalli-soft  { background: var(--bamalli-light); color: var(--bamalli); }

.no-results {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 32px 0;
}

@media (max-width: 480px) {
  .lb-teams { grid-template-columns: 1fr; }
  .lb-team-card.rank-1 { grid-column: span 1; }
  .profile-fields { grid-template-columns: 1fr; }
  .team-btns { grid-template-columns: 1fr 1fr; }
  .splash-title { font-size: 30px; }
  .splash-logo-img { width: 90px; height: 90px; }
}
</style>
</head>
<body>

<!-- CONFETTI -->
<canvas id="confetti-canvas"></canvas>

<!-- SPLASH -->

// ── NAV ───────────────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'leaderboard') renderLeaderboard();
  if (name === 'admin' && adminLoggedIn) renderAdminLog();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function handleSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const container = document.getElementById('search-results');
  if (!q) { container.innerHTML = ''; return; }

  const results = DELEGATES.filter(d =>
    d.full_name.toLowerCase().includes(q) ||
    d.nickname.toLowerCase().includes(q) ||
    d.id === q.padStart(3, '0') || d.id === q
  ).slice(0, 8);

  if (!results.length) {
    container.innerHTML = '<div class="no-results">No delegate found</div>';
    return;
  }
  container.innerHTML = results.map(d => {
    const t = TEAMS[d.team];
    const initials = d.full_name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `<div class="result-item" onclick="showProfile('${d.id}')">
      <div class="result-avatar team-${d.team}">${initials}</div>
      <div class="result-info">
        <div class="result-name">${d.full_name}</div>
        <div class="result-meta">${d.nickname} · ${d.university}</div>
      </div>
      <div class="result-badge team-${d.team}-soft">${t.crest} ${t.name}</div>
    </div>`;
  }).join('');
}

function showProfile(id) {
  const d = DELEGATES.find(x => x.id === id);
  if (!d) return;
  const t = TEAMS[d.team];
  const initials = d.full_name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const isIn = !!checkins[id];

  document.getElementById('profile-content').innerHTML = `
    <div class="profile-card">
      <div class="profile-banner" style="background:linear-gradient(135deg,${t.color}dd,${t.color}88)">
        <div class="profile-banner-inner"><span class="profile-team-crest">${t.crest}</span></div>
      </div>
      <div class="profile-avatar-wrap">
        <div class="profile-avatar team-${d.team}">${initials}</div>
        <button class="profile-checkin-btn ${isIn?'checked':''}" id="cbtn-${id}" onclick="toggleCheckin('${id}')">
          ${isIn ? '✓ Checked in' : 'Mark check-in'}
        </button>
      </div>
      <div class="profile-body">
        <div class="profile-name">${d.full_name}</div>
        <div class="profile-nickname">"${d.nickname}"</div>
        <div class="profile-fields">
          <div class="profile-field"><label>University</label><div class="val">${d.university}</div></div>
          <div class="profile-field"><label>Year</label><div class="val">${d.year}</div></div>
          <div class="profile-field"><label>Gender</label><div class="val">${d.gender}</div></div>
          <div class="profile-field"><label>Team</label><div class="val">${t.crest} ${t.name}</div></div>
        </div>
        <div class="profile-id-row">
          <span class="profile-id-label">Delegate ID</span>
          <span class="profile-id-val">${d.id}</span>
        </div>
        <div class="checkin-status ${isIn?'in':'out'}" id="cstatus-${id}">
          ${isIn
            ? '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Verified &amp; checked in'
            : '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Not yet checked in'
          }
        </div>
      </div>
    </div>`;

  document.getElementById('search-view').style.display = 'none';
  document.getElementById('profile-view').style.display = 'block';
}

function showSearchView() {
  document.getElementById('profile-view').style.display = 'none';
  document.getElementById('search-view').style.display = 'block';
}

function toggleCheckin(id) {
  if (checkins[id]) { delete checkins[id]; }
  else { checkins[id] = true; }
  save();
  showProfile(id);
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────────
function renderLeaderboard() {
  const sorted = Object.entries(points).sort((a,b) => b[1]-a[1]);
  document.getElementById('lb-teams').innerHTML = sorted.map(([key, pts], i) => {
    const t = TEAMS[key];
    return `<div class="lb-team-card lb-team-${key} ${i===0?'rank-1':''}">
      <div class="lb-rank">${i+1}</div>
      <div class="lb-crest">${t.crest}</div>
      <div class="lb-team-name">${t.name}</div>
      <div class="lb-points">${pts}<span>pts</span></div>
    </div>`;
  }).join('');

  const logEl = document.getElementById('lb-log');
  if (!log.length) {
    logEl.innerHTML = '<div class="empty-log">No points awarded yet</div>';
    return;
  }
  logEl.innerHTML = [...log].reverse().slice(0,20).map(e => {
    const t = TEAMS[e.team];
    return `<div class="lb-log-item">
      <div class="lb-log-left">
        <div class="lb-log-event">${e.event}</div>
        <div class="lb-log-team-name">${t.crest} ${t.name}</div>
      </div>
      <div class="lb-log-pts team-${e.team}-soft">+${e.pts}</div>
    </div>`;
  }).join('');
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function tryLogin() {
  if (document.getElementById('pin-input').value === ADMIN_PASSWORD) {
    adminLoggedIn = true;
    document.getElementById('admin-gate-view').style.display = 'none';
    document.getElementById('admin-panel-view').style.display = 'block';
    renderAdminLog();
  } else {
    document.getElementById('pin-err').textContent = 'Incorrect password';
    document.getElementById('pin-input').value = '';
  }
}

function adminLogout() {
  adminLoggedIn = false;
  document.getElementById('admin-gate-view').style.display = 'block';
  document.getElementById('admin-panel-view').style.display = 'none';
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-err').textContent = '';
}

function selectTeam(key) {
  selectedTeam = key;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('.team-btn-' + key).classList.add('selected');
}

function adjustPoints(delta) {
  const inp = document.getElementById('adm-points');
  inp.value = Math.max(1, (parseInt(inp.value)||0) + delta);
}

function awardPoints() {
  const event = document.getElementById('adm-event').value.trim();
  const pts   = parseInt(document.getElementById('adm-points').value);
  if (!event)        { showToast('Enter an event name'); return; }
  if (!selectedTeam) { showToast('Select a team first'); return; }
  if (!pts || pts<1) { showToast('Enter a valid point value'); return; }

  points[selectedTeam] = (points[selectedTeam]||0) + pts;
  log.push({ event, team: selectedTeam, pts, ts: Date.now() });
  save();

  const teamName = TEAMS[selectedTeam].name;
  document.getElementById('adm-event').value = '';
  document.getElementById('adm-points').value = '10';
  selectedTeam = null;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));

  renderAdminLog();
  showToast(`+${pts} pts awarded to ${teamName}`);
  fireConfetti();
}

function renderAdminLog() {
  const el = document.getElementById('adm-log');
  if (!log.length) { el.innerHTML = '<div class="empty-log">No entries yet</div>'; return; }
  el.innerHTML = [...log].reverse().map((e, i) => {
    const t = TEAMS[e.team];
    const realIdx = log.length - 1 - i;
    return `<div class="lb-log-item">
      <div class="lb-log-left">
        <div class="lb-log-event">${e.event}</div>
        <div class="lb-log-team-name">${t.crest} ${t.name} · ${new Date(e.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="lb-log-pts team-${e.team}-soft">+${e.pts}</div>
        <button class="btn-danger" onclick="deleteLogEntry(${realIdx})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function deleteLogEntry(idx) {
  const e = log[idx];
  points[e.team] = Math.max(0, (points[e.team]||0) - e.pts);
  log.splice(idx, 1);
  save();
  renderAdminLog();
  showToast('Entry removed');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#B8972A','#B03A2E','#154360','#1D6A3A','#f0f0f0','#0f1f3d'];
  const pieces = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 80,
    r: 4 + Math.random() * 6,
    color: colors[Math.floor(Math.random()*colors.length)],
    vx: (Math.random()-0.5)*4,
    vy: 2 + Math.random()*4,
    spin: (Math.random()-0.5)*0.2,
    angle: Math.random()*Math.PI*2,
    shape: Math.random() > 0.5 ? 'rect' : 'circle'
  }));

  let frame;
  let alpha = 1;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha = alpha;
    let alive = false;
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.angle += p.spin; p.vy += 0.05;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.r/2, -p.r*1.5, p.r, p.r*3);
      } else {
        ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) {
      if (pieces[0].y > canvas.height * 0.6) alpha = Math.max(0, alpha - 0.015);
      frame = requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.globalAlpha = 1;
    }
  }
  cancelAnimationFrame(frame);
  alpha = 1;
  draw();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderLeaderboard();
</script>
